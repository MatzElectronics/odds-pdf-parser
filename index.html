<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oregon ODDS PDF Parsers</title>
    <link rel="icon" type="image/png" href="images/odhs-logo.png">

    <style>
        :root {
            --primary: #0066cc;
            --bg: #f4f6f8;
            --card-bg: #ffffff;
            --text: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 2rem;
            background: var(--bg);
            color: var(--text);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
        }

        .card>div {
            margin-top: 3rem;
            display: flex;
            gap: 1rem;
            align-items: center;
            width: 100%;
            justify-content: center;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        a.btn {
            text-decoration: none;
        }

        a.btn:hover {
            background: #049;
            transform: scale(1.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 3rem;
        }

        #pci-btn {
            background: #cc00cc;
        }

        #pci-btn:hover {
            background: #990099;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card">
            <h2>Oregon ODDS PDF Parsers</h2>
            <img src="images/file-convert-diagram.svg" style="height:100px" />

            <div>
                <a href="isp-parser.html" class="btn">ISP Parser</a>
                <a href="pci-parser.html" class="btn" id="pci-btn">PCI Parser</a>
            </div>

            <div>
                <p><a href="https://oregonisp.org/instructions/samples/">Sample PDFs (OregonISP.org)</a></p>
            </div>
        </div>
    </div>
</body>

</html>
