<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oregon DHS ISP Extractor — Full Schema (Sec 1–17)</title>
  <!--
  <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  -->
  <script src="lib/pyodide.js"></script>
  <script src="lib/pdf.min.js"></script>

  <style>
    :root {
      --primary: #0066cc;
      --bg: #f4f6f8;
      --card-bg: #ffffff;
      --text: #333333;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 2rem;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      padding: 1.5rem;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .drop-zone {
      border: 2px dashed var(--primary);
      border-radius: 6px;
      padding: 2rem;
      text-align: center;
      background: #f0f7ff;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .drop-zone:hover {
      background: #e1f0ff;
    }

    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .grid-2 {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    pre {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 1rem;
      border-radius: 6px;
      overflow-x: auto;
      max-height: 600px;
      font-size: 12px;
      line-height: 1.4;
      max-width: 85vw;
      text-wrap: wrap;
    }

    .badge {
      background: #e1f0ff;
      color: var(--primary);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
    }

    #vector-data {
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="card">
      <h2>Oregon DHS ISP Parser</h2>
      <p>Spatial vector, layout, and text parsing.</p>

      <div class="drop-zone" onclick="document.getElementById('pdfFile').click()">
        <p>📁 Select or drop an Oregon DHS ISP PDF file</p>
        <input type="file" id="pdfFile" accept="application/pdf" style="display:none" onchange="updateFileName()">
        <strong id="fileName" style="color: var(--primary);">No file selected</strong>
      </div>

      <div style="margin-top: 1rem; display: flex; gap: 1rem; align-items: center;">
        <button id="extractBtn" class="btn" disabled onclick="processPdf()">Initialize Wasm Engine...</button>
        <span id="status" style="font-weight: bold; font-size: 0.9rem;">Starting Pyodide...</span>
      </div>
    </div>

    <div class="grid-2">
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
          <h3>Structured JSON <span class="badge">ISP Data</span></h3>
          <button class="btn" style="background:#0066cc; padding: 0.4rem 0.8rem; font-size: 0.8rem;"
            onclick="copyPayload()">Copy JSON</button>
        </div>
        <pre id="dynamicsOutput">Awaiting initialization...</pre>
      </div>

      <div class="card" id="vector-data">
        <h3>Extracted Layout & Vector Geometry <span class="badge">pdfminer.six</span></h3>
        <pre id="rawOutput">Awaiting initialization...</pre>
      </div>

      <div id="debug-visualizer-container" style="width: 100%; height: 700px; overflow: auto; border: 1px solid #444;">
      </div>
    </div>
  </div>

  <script>
    let pyodide = null;

    function updateFileName() {
      const input = document.getElementById('pdfFile');
      if (input.files.length > 0) {
        document.getElementById('fileName').innerText = input.files[0].name;
      }
    }

    // Set up PDF.js worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'lib/pdf.worker.min.js';
    //pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    window.pdfState = {
      file: null,
      arrayBuffer: null,
      pdfDoc: null,
      parsedPages: []
    };

    // 1. Initialize Pyodide Runtime
    async function initPyodide() {
      const status = document.getElementById('status');
      const btn = document.getElementById('extractBtn');

      try {
        status.innerText = "Loading Pyodide runtime...";
        pyodide = await loadPyodide();

        status.innerText = "Loading micropip package manager...";
        await pyodide.loadPackage("micropip");
        const micropip = pyodide.pyimport("micropip");

        status.innerText = "Installing pdfminer.six engine...";
        //await micropip.install("pdfminer.six");
        await micropip.install("./lib/pdfminer_six-20260107-py3-none-any.whl");

        status.innerText = "Ready!";
        btn.disabled = false;
        btn.innerText = "Process PDF";
        document.getElementById('dynamicsOutput').innerText = "Ready to parse PDF locally.";
        document.getElementById('rawOutput').innerText = "Ready to parse PDF locally.";
      } catch (err) {
        console.error("Pyodide Init Error:", err);
        status.innerText = "Failed to load Pyodide environment.";
        document.getElementById('dynamicsOutput').innerText = err.message;
      }
    }

    initPyodide();

    // 2. Main PDF Processing Handler
    async function processPdf() {
      const fileInput = document.getElementById('pdfFile');
      const status = document.getElementById('status');
      const btn = document.getElementById('extractBtn');
      const dynamicsOutput = document.getElementById('dynamicsOutput');
      const rawOutput = document.getElementById('rawOutput');

      if (!fileInput.files.length) {
        alert("Please select a PDF file first.");
        return;
      }

      btn.disabled = true;

      try {
        const file = fileInput.files[0];
        const arrayBuffer = await file.arrayBuffer();
        const uint8Array = new Uint8Array(arrayBuffer);

        // Load PDF.js Document Instance
        status.innerText = "Loading PDF.js rendering context...";
        const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer.slice(0) });
        const pdfDoc = await loadingTask.promise;
        window.pdfState.pdfDoc = pdfDoc;
        window.pdfState.arrayBuffer = arrayBuffer;

        // Run Python Vector & Text Extraction via Pyodide
        status.innerText = "Extracting layout geometry & text via Pyodide...";
        pyodide.FS.writeFile("input_isp.pdf", uint8Array);

        const pythonCode = `
import json
from pdfminer.high_level import extract_pages
from pdfminer.layout import (
    LTTextContainer, LAParams, LTRect, LTCurve, LTLine, LTContainer
)

def merge_lines(shapes, tolerance=2.0, min_length=15.0):
    controls = [s for s in shapes if s["type"] in ("checkbox", "radio")]
    h_lines = [s for s in shapes if s["type"] == "h_line"]
    v_lines = [s for s in shapes if s["type"] == "v_line"]

    merged_h, merged_v = [], []

    h_groups = {}
    for l in h_lines:
        bucket = round(l["global_y"] / tolerance)
        h_groups.setdefault(bucket, []).append(l)

    for lines in h_groups.values():
        lines.sort(key=lambda item: item["x0"])
        curr = None
        for l in lines:
            if curr is None:
                curr = dict(l)
            elif l["x0"] <= curr["x1"] + tolerance:
                curr["x1"] = max(curr["x1"], l["x1"])
            else:
                if (curr["x1"] - curr["x0"]) >= min_length:
                    merged_h.append(curr)
                curr = dict(l)
        if curr and (curr["x1"] - curr["x0"]) >= min_length:
            merged_h.append(curr)

    v_groups = {}
    for l in v_lines:
        bucket = round(l["global_x"] / tolerance)
        v_groups.setdefault(bucket, []).append(l)

    for lines in v_groups.values():
        lines.sort(key=lambda item: item["global_y0"])
        curr = None
        for l in lines:
            if curr is None:
                curr = dict(l)
            elif l["global_y0"] <= curr["global_y1"] + tolerance:
                curr["global_y1"] = max(curr["global_y1"], l["global_y1"])
                curr["y1"] = max(curr["y1"], l["y1"])
            else:
                if (curr["global_y1"] - curr["global_y0"]) >= min_length:
                    merged_v.append(curr)
                curr = dict(l)
        if curr and (curr["global_y1"] - curr["global_y0"]) >= min_length:
            merged_v.append(curr)

    return controls + merged_h + merged_v


def process_element(element, page_num, page_h, footer_y, y_offset, shapes, text_blocks):
    if isinstance(element, LTContainer) and not isinstance(element, LTTextContainer):
        for child in element:
            process_element(child, page_num, page_h, footer_y, y_offset, shapes, text_blocks)
        return

    local_top = round(page_h - element.y1, 2)
    local_bottom = round(page_h - element.y0, 2)
    if local_bottom > footer_y:
        return

    x0, x1 = round(element.x0, 2), round(element.x1, 2)
    global_top = round(y_offset + local_top, 2)
    global_bottom = round(y_offset + local_bottom, 2)

    local_bbox = [x0, local_top, x1, local_bottom]
    global_bbox = [x0, global_top, x1, global_bottom]

    if isinstance(element, (LTRect, LTCurve, LTLine)):
        w, h = round(element.width, 1), round(element.height, 1)

        if 6.0 <= w <= 20.0 and 6.0 <= h <= 20.0:
            shapes.append({
                "type": "checkbox" if isinstance(element, LTRect) else "radio",
                "bbox": local_bbox,
                "global_bbox": global_bbox,
                "is_checked": False,
                "page": page_num
            })
        else:
            mid_y = round((local_top + local_bottom) / 2, 2)
            mid_gy = round((global_top + global_bottom) / 2, 2)
            mid_x = round((x0 + x1) / 2, 2)

            if h <= 2.0 and w > 20.0:
                shapes.append({"type": "h_line", "x0": x0, "x1": x1, "y0": mid_y, "y1": mid_y, "global_y": mid_gy, "page": page_num})
            elif w <= 2.0 and h > 20.0:
                shapes.append({"type": "v_line", "x": mid_x, "global_x": mid_x, "y0": local_top, "y1": local_bottom, "global_y0": global_top, "global_y1": global_bottom, "page": page_num})
            elif w > 20.0 and h > 20.0:
                shapes.extend([
                    {"type": "h_line", "x0": x0, "x1": x1, "y0": local_top, "y1": local_top, "global_y": global_top, "page": page_num},
                    {"type": "h_line", "x0": x0, "x1": x1, "y0": local_bottom, "y1": local_bottom, "global_y": global_bottom, "page": page_num},
                    {"type": "v_line", "x": x0, "global_x": x0, "y0": local_top, "y1": local_bottom, "global_y0": global_top, "global_y1": global_bottom, "page": page_num},
                    {"type": "v_line", "x": x1, "global_x": x1, "y0": local_top, "y1": local_bottom, "global_y0": global_top, "global_y1": global_bottom, "page": page_num}
                ])

    elif isinstance(element, LTTextContainer):
        text = element.get_text().strip()
        if text and not text.startswith("Person receiving services:"):
            text_blocks.append({
                "text": text,
                "bbox": local_bbox,
                "global_bbox": global_bbox,
                "has_check_symbol": any(c in text for c in ['[X]', '[x]', '☑', '■', '✔']),
                "page": page_num
            })

parsed_pages = []
current_y_offset = 0.0
laparams = LAParams(line_margin=0.2, word_margin=0.1, boxes_flow=None)

for page_layout in extract_pages("input_isp.pdf", laparams=laparams):
    page_num = page_layout.pageid
    raw_shapes, text_blocks = [], []
    page_h = page_layout.height
    footer_y = page_h - 24.0

    for element in page_layout:
        process_element(element, page_num, page_h, footer_y, current_y_offset, raw_shapes, text_blocks)

    parsed_pages.append({
        "page": page_num,
        "page_height": page_h,
        "shapes": merge_lines(raw_shapes, tolerance=2.0, min_length=15.0),
        "text_blocks": text_blocks
    })

    current_y_offset += page_h

json.dumps(parsed_pages)
`;

        const jsonString = await pyodide.runPythonAsync(pythonCode);
        const rawParsedPages = JSON.parse(jsonString);

        // Run Canvas Pixel Inspection & Grouping
        status.innerText = "Evaluating form checkbox states via Canvas...";
        const evaluatedPages = await processCanvasFormControls(pdfDoc, rawParsedPages);

        window.pdfState.parsedPages = evaluatedPages;
        rawOutput.innerText = JSON.stringify(evaluatedPages, null, 2);

        // Map JSON Schema against Evaluated Controls
        status.innerText = "Mapping ISP Schema against parsed output...";
        const schemaPayload = await matchExtendedISPSchema(evaluatedPages);
        dynamicsOutput.innerText = JSON.stringify(schemaPayload, null, 2);

        status.innerText = "Parsing & Schema Matching Complete!";

        // Render Debug Visualizer SVG Overlay
        if (typeof renderParsedPdfSvg === 'function') {
          await renderParsedPdfSvg(evaluatedPages, 'debug-visualizer-container', pdfDoc, {
            bgOpacity: 0.65,
            showCheckboxes: true,
            showText: true
          });
        }

      } catch (err) {
        console.error("Pipeline Execution Error:", err);
        status.innerText = "Error processing PDF.";
        dynamicsOutput.innerText = err.message;
      } finally {
        btn.disabled = false;
      }
    }

    // 3. Canvas Pixel Inspector Bridge
    async function processCanvasFormControls(pdfDoc, parsedPages, scale = 2.0) {
      for (const pageObj of parsedPages) {
        const pageNum = pageObj.page;

        // 1. Isolate controls and structural elements
        const rawControls = pageObj.shapes.filter(s => s.type === 'checkbox' || s.type === 'radio');
        const nonControlShapes = pageObj.shapes.filter(s => s.type !== 'checkbox' && s.type !== 'radio');

        if (rawControls.length > 0) {
          // 2. Deduplicate shapes first (removes nested/overlapping vector duplicates)
          const uniqueControls = groupShapesByLargestParent(rawControls, { maxCentroidDistance: 12.0 });

          // 3. Evaluate pixels ONLY on unique controls
          const pdfPage = await pdfDoc.getPage(pageNum);
          const evaluatedControls = await evaluateControlsWithCanvas(pdfPage, uniqueControls, scale);

          // 4. Overwrite pageObj.shapes so all subsequent steps only see clean controls
          pageObj.shapes = [...evaluatedControls, ...nonControlShapes];
        }
      }

      return parsedPages;
    }

    // 4. Canvas Pixel Evaluator Execution
    async function evaluateControlsWithCanvas(pdfPage, controls, scale = 2.0) {
      const viewport = pdfPage.getViewport({ scale: 1.0 });
      const canvas = document.createElement('canvas');
      canvas.width = Math.ceil(viewport.width * scale);
      canvas.height = Math.ceil(viewport.height * scale);
      const ctx = canvas.getContext('2d', { willReadFrequently: true });

      await pdfPage.render({
        canvasContext: ctx,
        viewport: pdfPage.getViewport({ scale })
      }).promise;

      return controls.map(control => {
        const [x0, y0, x1, y1] = control.bbox;

        const pxLeft = Math.floor(x0 * scale);
        const pxTop = Math.floor(y0 * scale);
        const pxWidth = Math.ceil((x1 - x0) * scale);
        const pxHeight = Math.ceil((y1 - y0) * scale);

        const padX = Math.floor(pxWidth * 0.20);
        const padY = Math.floor(pxHeight * 0.20);
        const cropX = pxLeft + padX;
        const cropY = pxTop + padY;
        const cropW = Math.max(1, pxWidth - padX * 2);
        const cropH = Math.max(1, pxHeight - padY * 2);

        let darkPixels = 0;
        const totalPixels = cropW * cropH;

        try {
          const imageData = ctx.getImageData(cropX, cropY, cropW, cropH);
          const data = imageData.data;

          for (let i = 0; i < data.length; i += 4) {
            if (data[i + 3] > 0) { // Check non-transparent pixels
              const brightness = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
              if (brightness < 180) darkPixels++;
            }
          }
        } catch (e) {
          console.warn("Pixel sampling out of bounds:", e);
        }

        const darkRatio = totalPixels > 0 ? (darkPixels / totalPixels) : 0;

        return {
          ...control,
          is_checked: darkRatio > 0.12
        };
      });
    }

    /**
     * Global helper to check if a target phrase has an associated checked shape (checkbox/radio)
     * or contains inline text check symbols ([X], ☑, etc.).
     *
     * @param {string} targetPhrase - The label text to search for.
     * @param {Array} allBlocks - Flat list of all text blocks across all pages.
     * @param {Array} allShapes - Flat list of all evaluated shapes (checkboxes/radios) across all pages.
     * @returns {boolean}
     */
    function isOptionChecked(targetPhrase, allBlocks = [], allShapes = [], bbox = null) {
      const targetLower = targetPhrase.toLowerCase();

      if (bbox) {
        allBlocks = allBlocks.filter(b =>
          b.global_bbox[0] >= bbox[0] &&
          b.global_bbox[1] >= bbox[1] &&
          b.global_bbox[2] <= bbox[2] &&
          b.global_bbox[3] <= bbox[3]
        );
      }

      // Find all blocks containing the target phrase
      let matchingBlocks = allBlocks;
      if (allBlocks.length > 1) {
        matchingBlocks = allBlocks.filter(b => b.text.toLowerCase().includes(targetLower));
      }

      for (const block of matchingBlocks) {
        const textBbox = block.bbox;

        // Use shapes attached to block or fall back to page shapes
        const candidateShapes = (block.shapes && block.shapes.length > 0)
          ? block.shapes
          : allShapes.filter(s => s.page === block.page);

        // Look for a shape aligned with this specific text line
        let foundAssociatedShape = false;

        for (const shape of candidateShapes) {
          if (shape.type !== 'checkbox' && shape.type !== 'radio') continue;

          const shapeBbox = shape.bbox;
          const verticalDiff = Math.abs(shapeBbox[1] - textBbox[1]);
          const horizontalDistance = textBbox[0] - shapeBbox[2];

          // Strict spatial alignment check (within 10px vertically)
          if (verticalDiff <= 5 && horizontalDistance >= -10 && horizontalDistance <= 20) {
            foundAssociatedShape = true;

            // Return the canvas evaluator's decision for this specific shape
            if (shape.is_checked) {
              return true;
            }
          }
        }

        // Fallback: Only check block glyphs if NO shape was spatially matched nearby
        if (!foundAssociatedShape && block.has_check_symbol) {
          // Ensure the text line itself contains an explicit checked symbol, not just an unchecked box symbol
          if (/[\u2611\u2612\u2705\u2713\u2714]|\[x\]/i.test(block.text)) {
            return true;
          }
        }
      }

      return false;
    }

    // 5. Extended Schema Matcher Function
    async function matchExtendedISPSchema(pages) {
      /*
      let allBlocks = [];
      pages.forEach(p => {
        (p.text_blocks || []).forEach(tb => {
          allBlocks.push({ ...tb, page: p.page, shapes: p.shapes || [] });
        });
      });
      */

      let allBlocks = pages.flatMap(p =>
        (p.text_blocks || []).map(tb => ({
          ...tb,
          page: p.page,
          shapes: p.shapes.filter(s => s.type === 'checkbox' || s.type === 'radio') // Cleaned controls only
        }))
      );
      window.docBlocks = allBlocks;

      const allShapes = pages.flatMap(page => page.shapes);
      const lines = allBlocks.map(b => b.text);
      const fullText = lines.join("\n");

      const checkOption = (phrase, bbox = null) => isOptionChecked(phrase, allBlocks, allShapes, bbox);

      let output = {
        generalInfo: parseGeneralInfo(fullText),
        onePageProfiles: parseOnePageProfiles(fullText, allBlocks),
        desiredOutcomes: parseDesiredOutcomes(allBlocks, allShapes),
        employmentPlan: parseCareerDevelopmentPlan(checkOption, allBlocks, allShapes),
        caseManagement: parseCaseManagementServices(checkOption, allBlocks),
        informalSupports: parseInformalSupports(allBlocks, allShapes),
        chosenSPPCservices: parseSPPCservices(checkOption, allBlocks, allShapes),
        familySupportServices: parseGenericServiceSection("Chosen family support services", "Chosen K plan services", checkOption, allBlocks, allShapes),
        kPlanServices: parseGenericServiceSection("Chosen K plan services", "Chosen waiver services", checkOption, allBlocks, allShapes),
        waiverServices: parseGenericServiceSection("Chosen waiver services", "Chosen K plan residential services", checkOption, allBlocks, allShapes),
        kPlanResidentialServices: parseChosenKplanResidentialServices(checkOption, allBlocks),
        additionalServices: parseAdditionalChosenServices(checkOption, allBlocks),
        riskManagementPlan: parseRiskManagementPlan(checkOption, allBlocks),
        knownRisksAndInterventions: parseKnownRisks(checkOption, allBlocks, allShapes),
        differences: parsePlanDifferences(fullText),
        legalRelationships: parseLegalRelationships(checkOption, allBlocks, allShapes),
        acknowledgments: parseAcknowledgments(checkOption, allBlocks),
        agreements: parseAgreements(allBlocks, allShapes)
      };

      output.generalInfo.primeNumber = output.caseManagement.primeNumber;
      delete output.caseManagement.primeNumber;

      return output;
    }

    function matchPattern(text, regex) {
      const m = text.match(regex);
      return m ? m[1].trim() : null;
    }


    function parseGeneralInfo(fullText) {
      return {
        personsLegalName: matchPattern(fullText, /Person's legal name:\s*([^\n]+)/i),
        preferredName: matchPattern(fullText, /Preferred name:\s*([^\n]+)/i),
        planEffectiveDates: {
          start: matchPattern(fullText, /Plan effective dates:\s*([\d\/]+)\s*–/i),
          end: matchPattern(fullText, /Plan effective dates:\s*[\d\/]+\s*–\s*([\d\/]+)/i)
        }
      }
    }

    /**
     * SECTION 2: One Page Profiles
     */
    function parseOnePageProfiles(fullText, allBlocks) {
      let secBlocks = [];
      let currentGroup = [];
      let inSec = false;

      allBlocks.forEach((b) => {
        const txt = b.text.trim();
        if (/^One page profile for\b/i.test(txt)) {
          if (currentGroup.length > 0) secBlocks.push(currentGroup);
          currentGroup = [];
          inSec = true;
        }
        if (/^Desired outcomes\b/i.test(txt)) {
          inSec = false;
        }
        if (inSec) {
          currentGroup.push(b);
        }
      });
      if (currentGroup.length > 0) secBlocks.push(currentGroup);

      const profiles = [];

      secBlocks.forEach(sec => {
        let profile = {
          onePageProfileFor: '',
          whatPeopleLikeAndAdmire: '',
          whatIsImportantTo: '',
          howToBestSupport: ''
        };

        const importantBlock = sec.find(b => /^What is important to\b/i.test(b.text));
        const yMark = importantBlock ? importantBlock.global_bbox[1] : 999999;

        sec.forEach(b => {
          const txt = b.text.trim();

          if (/^One page profile for\b/i.test(txt)) {
            profile.onePageProfileFor = txt.replace(/^One page profile for:\s*/i, '').trim();
          } else if (
            !(/^How to best support\b/i.test(txt)) &&
            !(/^What people like and admire about\b/i.test(txt)) &&
            !(/^What is important to\b/i.test(txt))
          ) {
            if (b.global_bbox[0] >= 100) {
              profile.howToBestSupport += txt + '\n';
            } else if (b.global_bbox[1] < yMark) {
              profile.whatPeopleLikeAndAdmire += txt + '\n';
            } else {
              profile.whatIsImportantTo += txt + '\n';
            }
          }
        });

        profile.howToBestSupport = profile.howToBestSupport.trim();
        profile.whatPeopleLikeAndAdmire = profile.whatPeopleLikeAndAdmire.trim();
        profile.whatIsImportantTo = profile.whatIsImportantTo.trim();

        profiles.push(profile);
      });

      return profiles;
    }


    /**
     * SECTION 3: Desired Outcomes
     */
    function parseDesiredOutcomes(allBlocks, allShapes) {
      let [secBlocks, secText, endBlock] = isolateSection(allBlocks, "Desired outcomes", "Career Development Plan");

        const tableLines = [{
          h_lines: getLinesInRange(allShapes, {
            type: 'h',

            type: 'v',
            yRange: [topBound, bottomBound],

          tableLines[0].h_lines = tableLines[0].h_lines.filter(l => {

            desiredSmallGroupHours: matchPattern(secText, /Get small group employment for\s*(\d+)\s*hours per week/i),
            checkboxes: {

      if (secText.includes("No career development plan")) {

        return {

    function parseGenericServiceSection(sectionHeader, nextSectionHeader, checkOption, allBlocks, allShapes) {

      const headerBlock = allBlocks.find(b => b.text.startsWith(sectionHeader));
      const checkboxBounds = [0, headerBlock.global_bbox[1] - 10, 780, headerBlock.global_bbox[3] + 150];
      const noneSelected = checkOption("None selected", checkboxBounds);
      if (noneSelected) { return { status: "None Selected" } }

      let [secBlocks, secText, endBlock] = isolateSection(allBlocks, sectionHeader, nextSectionHeader);

      let output = { status: "Active", servicesTable: [] };

      let serviceGroups = [];
      let idx = 0;
      secBlocks.forEach(b => {
        if (/Service element:/i.test(b.text)) {
          idx++;
        }
        if (!serviceGroups[idx]) {
          serviceGroups[idx] = [];
        }
        serviceGroups[idx].push(b);
      });
      serviceGroups.shift();

      serviceGroups.forEach(g => {
        let outputGroup = { serviceUnits: [] };
        let unitGroups = [];
        let jdx = 0;

        const lines = g.map(b => b.text);
        const groupText = lines.join("\n");

        outputGroup.serviceElement = matchPattern(groupText, /Service element:\s*([^\n]+)/i);
        outputGroup.serviceCode = matchPattern(groupText, /Service code:\s*([^\n]+)/i);

        g = g.sort((a, b) => Math.round(a.bbox[0] / 10) - Math.round(b.bbox[0] / 10));
        g = g.sort((a, b) => Math.round(a.global_bbox[1] / 10) - Math.round(b.global_bbox[1] / 10));

        g.forEach(b => {
          if (/Number of units/i.test(b.text)) {
            jdx++;
          }
          if (!unitGroups[jdx]) {
            unitGroups[jdx] = [];
          }
          unitGroups[jdx].push(b);
        });
        unitGroups.shift();

        unitGroups.forEach((u, k) => {
          const ul = u.map(b => b.text);
          const ut = ul.join("\n");

          const dateCheck = u.find(b => b.text.trim().startsWith('Same as plan effective dates')).global_bbox;
          const sameAsPlan = checkOption("Same as plan effective dates", [dateCheck[0] - 20, dateCheck[1] - 5, dateCheck[2], dateCheck[3] + 5]);

          outputGroup.serviceUnits.push({
            units: matchPattern(ut, /Number of units:\s*([^\n]+)/i),
            unitType: matchPattern(ut, /Unit type:\s*([^\n]+)/i),
            frequency: matchPattern(ut, /Per \(frequency\):\s*([^\n]+)/i),
            authorizedDatesSameAsPlan: sameAsPlan,
            startDate: sameAsPlan ? null : matchPattern(ut, /Start date:\s*([\d\/]+)/i),
            endDate: sameAsPlan ? null : matchPattern(ut, /End date:\s*([\d\/]+)/i)
          });
        });

        outputGroup.chosenProviderTypesAndRates = matchPattern(groupText, /Chosen provider type\(s\) and current rate\(s\)[^:]*:\s*([\s\S]*?)(?=List needs identified|$)/i) || "";
        outputGroup.identifiedNeeds = matchPattern(groupText, /List needs identified by the needs assessment that this service will address:\s*([\s\S]*?)(?=.*?'s preference|$)/i) || "";
        outputGroup.preferenceOnDelivery = matchPattern(groupText, /preference on how this service is delivered:\s*([\s\S]*?)(?=Chosen|Section|$)/i) || "";

        output.servicesTable.push(outputGroup);
      });

      return output;
    }

        const tableBlocks = secBlocks.filter(b => b.global_bbox[1] > topAnchor.global_bbox[3] && b.global_bbox[1] < bottomAnchor.global_bbox[1]);
        const topBound = topAnchor.global_bbox[3] - 2;
        const bottomBound = bottomAnchor.global_bbox[1];

        const tableLines = [{
          h_lines: getLinesInRange(allShapes, {
            type: 'h',
            yRange: [topBound, bottomBound],
            xRange: [8, 770]
          }),
          v_lines: getLinesInRange(allShapes, {
            type: 'v',
            yRange: [topBound, bottomBound],
            xRange: [8, 770]
          })
        }];

        if (tableLines[0].v_lines.length > 0) {
          // Get the maximum bottom edge across ALL vertical lines
          const maxVBottom = Math.max(...tableLines[0].v_lines.map(l => l.global_y1 ?? l.global_y0 ?? l.y1));

          tableLines[0].h_lines = tableLines[0].h_lines.filter(l => {
            const gy = l.global_y ?? l.global_y0 ?? l.y0;
            return gy <= maxVBottom + 5;
          });
        }

        const tableCells = generateCellBoundingBoxes(tableLines);
        // Isolate the middle column with the checkboxes
        const colCells = tableCells[0].rows.map(r => { return r.cells[1] }).slice(1);
        highRiskChecks = [];
        colCells.forEach(cc => {
          highRiskChecks.push(allShapes.find(s =>
            s.type == 'checkbox' &&
            s.global_bbox[0] > cc.globalBbox.x0 &&
            s.global_bbox[1] > cc.globalBbox.y0 &&
            s.global_bbox[2] < cc.globalBbox.x1 &&
            s.global_bbox[3] < cc.globalBbox.y1
          ).is_checked);
        });

        let tableContents = tableCells[0] ? mapTextToTableRows(tableCells[0], tableBlocks, ['risk', 'highRisk', 'howAddressedOrOtherInfo']) : [];
        if (tableContents != []) {
          tableContents.forEach((tc, i) => {
            tc.highRisk = highRiskChecks[i];
          });
        }

        return tableContents;
      }

      let output = {
        hasKnownSeriousRisks: !noneSelected,
        risksTable: parseTable(),
        safeguardingInterventions: checkOption("Yes, attach a completed IBL form authorizing the use of safeguarding intervention") ? "Yes" : "No",
        safeguardingEquipment: checkOption("Yes, attach a completed IBL form authorizing the use of safeguarding equipment") ? "Yes" : "No",
      };

      if (/HCBS residential setting protections/.test(secText)) {
        const acceptedProtections = secBlocks.find(b => /HCBS residential setting protections accepted/i.test(b.text.trim())).global_bbox;
        const proposedProtections = secBlocks.find(b => /HCBS residential setting protections proposed/i.test(b.text.trim())).global_bbox;

        output.acceptedHCBSlimitations = checkOption("Yes, attach a completed IBL form", [75, acceptedProtections[3], 500, acceptedProtections[3] + 50]) ? "Yes" : "No";
        output.proposedHCBSlimitations = checkOption("Yes, attach a completed IBL form", [75, proposedProtections[3], 500, proposedProtections[3] + 50]) ? "Yes" : "No";
      }

      const nursingChecksAnchor = secBlocks.find(b => /^Does .*? have a nursing care plan/i.test(b.text.trim())).global_bbox;
      const nursingCheckBounds = [75, nursingChecksAnchor[3], 500, nursingChecksAnchor[3] + 60];

      const hasNursingPlanYes = checkOption("Yes, it is found at", nursingCheckBounds);
      const hasNursingPlanNeeded = checkOption("Needed", nursingCheckBounds);

      const backupPlansText = secText.split('Back-up plans (in the event')[1];
      let backupOthers = ((backupPlansText.split('Other:') || ['']).slice(1) || []).join('\n').replace(/Other:/g, '');

      output.nursingCarePlan = {
        status: hasNursingPlanYes ? "Yes" : (hasNursingPlanNeeded ? "Needed" : "No"),
        locationHome: hasNursingPlanYes ? matchPattern(secText, /Home:\s*([^\n]+)/i) : null,
        locationWork: hasNursingPlanYes ? matchPattern(secText, /Work:\s*([^\n]+)/i) : null
      };
      output.backupPlans = {
        home: matchPattern(backupPlansText, /Home:\s*([^\n]+)/i),
        workSchoolDaySupports: matchPattern(backupPlansText, /Work\/school\/day supports:\s*([^\n]+)/i),
        other: backupOthers
      };

      return output;
    }

    function parsePlanDifferences(fullText) {
      if (!fullText.includes("Differences")) return null;
      return {
        personWantsDifferences: matchPattern(fullText, /Note any differences between the contents of this plan and what .*? wants[\s\S]*?:\s*([\s\S]*?)(?=Note any differences between the contents of this plan and what any other ISP contributor|$)/i) || null,

    function parseLegalRelationships(checkOption, allBlocks, allShapes) {
      const sectionHeader = "Legal relationships";
      const nextSectionHeader = "Acknowledgments"

      const headerBlock = allBlocks.find(b => b.text.startsWith(sectionHeader));
      const checkboxBounds = [0, headerBlock.global_bbox[1] - 10, 780, headerBlock.global_bbox[3] + 150];
      const noneKnown = checkOption("No known legal relationships", checkboxBounds);
      if (noneKnown) { return { status: "No known legal relationships" } }

      let [secBlocks, secText, endBlock] = isolateSection(allBlocks, sectionHeader, nextSectionHeader);

      secBlocks = secBlocks.sort((a, b) => Math.round(a.bbox[0] / 10) - Math.round(b.bbox[0] / 10));
      secBlocks = secBlocks.sort((a, b) => Math.round(a.global_bbox[1] / 10) - Math.round(b.global_bbox[1] / 10));

      /**
       * Helper: Extracts barriers table using Section 3 line-range and cell mapping techniques.
       */
      function parseTable() {
        const topAnchor = secBlocks[0];
        const bottomAnchor = secBlocks[secBlocks.length - 1];
        if (!bottomAnchor || !topAnchor) return [];

        const tableBlocks = secBlocks.slice(1);
        const topBound = topAnchor.global_bbox[3] - 2;
        const bottomBound = endBlock.global_bbox[1];

        const tableLines = [{
          h_lines: getLinesInRange(allShapes, {
            type: 'h',
            yRange: [topBound, bottomBound],
            xRange: [8, 770]
          }),
          v_lines: getLinesInRange(allShapes, {
            type: 'v',
            yRange: [topBound, bottomBound],
            xRange: [8, 770]
          })
        }];

        tableLines[0].h_lines = tableLines[0].h_lines.filter(l => l.x0 < 50);

        if (tableLines[0].v_lines.length > 0) {
          // Get the maximum bottom edge across ALL vertical lines
          const maxVBottom = Math.max(...tableLines[0].v_lines.map(l => l.global_y1 ?? l.global_y0 ?? l.y1));

          tableLines[0].h_lines = tableLines[0].h_lines.filter(l => {
            const gy = l.global_y ?? l.global_y0 ?? l.y0;
            return gy <= maxVBottom + 5;
          });
        }

        const tableCells = generateCellBoundingBoxes(tableLines);

        return tableCells[0] ? mapTextToTableRows(tableCells[0], tableBlocks, ['relationshipType', 'names']) : [];
      }

      return { status: "Active", legalRelationshipsTable: parseTable() };
    }

    function parseAcknowledgments(checkOption, allBlocks) {

        employmentSettingsOptionsOffered: matchPattern(secText, /Describe the options offered about settings where .*? can receive employment[\s\S]*?-based options\.\s*([\s\S]*?)(?=Did the SC\/PA review the services|$)/i) || "Not applicable",
        scPaReviewedServicesAvailable: radioGroups[1],
        ispReflectsChosenServicesAndOutcomes: radioGroups[2],
        scPaOfferedProviderOptions: radioGroups[3],
        reflectsNeededFamilySupports: radioGroups[4],
        providedInfoOnPlanningProcessAndChanges: radioGroups[5],
        opportunityToChooseMeetingLocation: radioGroups[6],
        opportunityToChooseParticipants: radioGroups[7],
        receivedDhsRightsNotification: radioGroups[8],
        reflectsIndependence: radioGroups[9],
        reflectsIntegration: radioGroups[10],
        reflectsProductivity: radioGroups[11],
        explainNoResponses: matchPattern(secText, /Describe the reason for any[\s\S]*?:\s*([\s\S]*?)(?=$)/i) || "Not applicable",
      };
    }

    function parseAgreements(allBlocks, allShapes) {

          })
        }];

        tableLines[0].h_lines = tableLines[0].h_lines.filter(l => l.x0 < 50);

        if (tableLines[0].v_lines.length > 0) {

          const maxVBottom = Math.max(...tableLines[0].v_lines.map(l => l.global_y1 ?? l.global_y0 ?? l.y1));

    /**
     * Renders parsed PDF metadata overlayed directly on top of rendered PDF page images.
     * 
     * @param {Array<Object>} parsedPages - Array of parsed page objects with shapes, text_blocks, page_height
     * @param {HTMLElement|string} container - Target DOM element or element ID
     * @param {PDFDocumentProxy} [pdfDoc=null] - Loaded PDF.js document object (for background rendering)
     * @param {Object} [options] - Configuration overrides
     */
    async function renderParsedPdfSvg(parsedPages, container, pdfDoc = null, options = {}) {
      const target = typeof container === 'string' ? document.getElementById(container) : container;
      if (!target) {
        console.error('Target container element not found.');
        return;
      }

      const config = {
        padding: options.padding || 20,
        backgroundColor: options.backgroundColor || '#1e1e24',
        showText: options.showText !== undefined ? options.showText : true,
        showCheckboxes: options.showCheckboxes !== undefined ? options.showCheckboxes : true,
        showImages: options.showImages !== undefined ? options.showImages : true,
        renderScale: options.renderScale || 2.0, // Scale for high-DPI background rendering
        strokeWidth: options.strokeWidth || 2.5,
        minScale: 0.2,
        maxScale: 10,
        ...options
      };

      const palette = [
        "#FF5722", "#4CAF50", "#2196F3", "#E91E63", "#9C27B0",
        "#00BCD4", "#FFC107", "#8BC34A", "#3F51B5", "#FF9800"
      ];

      // 1. Calculate document dimensions & cumulative page Y-offsets
      let totalHeight = 0;
      let maxWidth = 0;
      const pageYOffsets = [];

      parsedPages.forEach(page => {
        pageYOffsets.push(totalHeight);
        totalHeight += page.page_height;

        page.shapes.concat(page.text_blocks || []).forEach(item => {
          const bbox = item.global_bbox || item.bbox;
          if (bbox && bbox[2] > maxWidth) maxWidth = bbox[2];
        });
      });

      maxWidth = maxWidth > 0 ? maxWidth + config.padding : 612;
      totalHeight = totalHeight > 0 ? totalHeight + config.padding : 792;

      // 2. Setup DOM Container
      target.innerHTML = '';
      target.style.position = 'relative';
      target.style.overflow = 'hidden';

      const svgNS = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(svgNS, "svg");
      svg.setAttribute("width", "100%");
      svg.setAttribute("height", "100%");
      svg.style.backgroundColor = config.backgroundColor;
      svg.style.cursor = "grab";
      svg.style.userSelect = "none";

      // Root Viewport Group for Pan/Zoom
      const viewport = document.createElementNS(svgNS, "g");
      svg.appendChild(viewport);

      // Group 1: Background Images (Rendered Canvas Pages)
      const bgGroup = document.createElementNS(svgNS, "g");
      bgGroup.setAttribute("id", "pdf-background-layer");
      viewport.appendChild(bgGroup);

      // Group 2: SVG Vector Overlay Layer (Lines, BBoxes, Checkboxes)
      const overlayGroup = document.createElementNS(svgNS, "g");
      overlayGroup.setAttribute("id", "pdf-overlay-layer");
      viewport.appendChild(overlayGroup);

      // Pan / Zoom State
      let scale = 1;
      let pointX = 0;
      let pointY = 0;
      let isPanning = false;
      let startX = 0;
      let startY = 0;

      function updateTransform() {
        viewport.setAttribute("transform", `translate(${pointX}, ${pointY}) scale(${scale})`);
      }

      // --- PAN & ZOOM EVENT HANDLERS ---
      svg.addEventListener('wheel', (e) => {
        e.preventDefault();
        const rect = svg.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        const zoomFactor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
        const newScale = Math.min(Math.max(scale * zoomFactor, config.minScale), config.maxScale);

        if (newScale !== scale) {
          pointX = mouseX - (mouseX - pointX) * (newScale / scale);
          pointY = mouseY - (mouseY - pointY) * (newScale / scale);
          scale = newScale;
          updateTransform();
        }
      });

      svg.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        isPanning = true;
        startX = e.clientX - pointX;
        startY = e.clientY - pointY;
        svg.style.cursor = 'grabbing';
      });

      window.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        pointX = e.clientX - startX;
        pointY = e.clientY - startY;
        updateTransform();
      });

      window.addEventListener('mouseup', () => {
        if (isPanning) {
          isPanning = false;
          svg.style.cursor = 'grab';
        }
      });

      // --- TOOLTIP SETUP ---
      let tooltip = document.getElementById('svg-debug-tooltip');
      if (!tooltip) {
        tooltip = document.createElement('div');
        tooltip.id = 'svg-debug-tooltip';
        tooltip.style.position = 'fixed';
        tooltip.style.padding = '6px 10px';
        tooltip.style.background = 'rgba(0,0,0,0.85)';
        tooltip.style.color = '#fff';
        tooltip.style.fontSize = '12px';
        tooltip.style.fontFamily = 'monospace';
        tooltip.style.borderRadius = '4px';
        tooltip.style.pointerEvents = 'none';
        tooltip.style.display = 'none';
        tooltip.style.zIndex = '9999';
        document.body.appendChild(tooltip);
      }

      // --- 3. RENDER CANVASES & INJECT INTO BACKGROUND LAYER ---
      if (config.showImages && pdfDoc) {
        for (let i = 0; i < parsedPages.length; i++) {
          const pageNum = parsedPages[i].page_number || (i + 1);
          const pageY = pageYOffsets[i];

          try {
            const page = await pdfDoc.getPage(pageNum);
            const viewport1x = page.getViewport({ scale: 1.0 });

            // Render to offscreen canvas
            const canvas = document.createElement('canvas');
            canvas.width = Math.ceil(viewport1x.width * config.renderScale);
            canvas.height = Math.ceil(viewport1x.height * config.renderScale);
            const ctx = canvas.getContext('2d');

            await page.render({
              canvasContext: ctx,
              viewport: page.getViewport({ scale: config.renderScale })
            }).promise;

            // Convert canvas to Data URL
            const dataUrl = canvas.toDataURL('image/png');

            // Create SVG <image> underlay mapped to 1.0x PDF point coordinates
            const imgEl = document.createElementNS(svgNS, "image");
            imgEl.setAttributeNS("http://www.w3.org/1999/xlink", "href", dataUrl);
            imgEl.setAttribute("x", 0);
            imgEl.setAttribute("y", pageY);
            imgEl.setAttribute("width", viewport1x.width);
            imgEl.setAttribute("height", viewport1x.height);
            imgEl.style.opacity = options.bgOpacity !== undefined ? options.bgOpacity : 0.85;

            bgGroup.appendChild(imgEl);
          } catch (err) {
            console.warn(`Could not render PDF background for page ${pageNum}:`, err);
          }
        }
      }

      // --- 4. PAGE SEPARATORS ---
      pageYOffsets.forEach((y, idx) => {
        if (idx > 0) {
          const sep = document.createElementNS(svgNS, "line");
          sep.setAttribute("x1", 0);
          sep.setAttribute("y1", y);
          sep.setAttribute("x2", maxWidth);
          sep.setAttribute("y2", y);
          sep.setAttribute("stroke", "#ff4444");
          sep.setAttribute("stroke-width", "1");
          sep.setAttribute("stroke-dasharray", "4,4");
          overlayGroup.appendChild(sep);
        }
      });

      // --- 5. RENDER OVERLAY VECTOR SHAPES & TEXT ---
      let colorIdx = 0;

      parsedPages.forEach(page => {
        // Text Bounding Boxes
        if (config.showText && page.text_blocks) {
          page.text_blocks.forEach(tb => {
            const bbox = tb.global_bbox || tb.bbox;
            const rect = document.createElementNS(svgNS, "rect");
            rect.setAttribute("x", bbox[0]);
            rect.setAttribute("y", bbox[1]);
            rect.setAttribute("width", bbox[2] - bbox[0]);
            rect.setAttribute("height", bbox[3] - bbox[1]);
            rect.setAttribute("fill", "rgba(255, 255, 255, 0.05)");
            rect.setAttribute("stroke", "rgba(255, 255, 255, 0.3)");
            rect.setAttribute("stroke-width", "0.5");

            rect.addEventListener('mouseenter', () => {
              tooltip.style.display = 'block';
              tooltip.innerText = `Text: "${tb.text.substring(0, 35)}${tb.text.length > 35 ? '...' : ''}"\nBBox: [${bbox.join(', ')}]`;
            });
            rect.addEventListener('mousemove', (e) => {
              tooltip.style.left = (e.clientX + 12) + 'px';
              tooltip.style.top = (e.clientY + 12) + 'px';
            });
            rect.addEventListener('mouseleave', () => tooltip.style.display = 'none');

            overlayGroup.appendChild(rect);
          });
        }

        // Checkboxes & Radio Buttons
        if (config.showCheckboxes) {
          const controls = page.shapes.filter(s => s.type === 'checkbox' || s.type === 'radio');
          controls.forEach(ctrl => {
            const bbox = ctrl.global_bbox || ctrl.bbox;
            const width = bbox[2] - bbox[0];
            const height = bbox[3] - bbox[1];

            const box = document.createElementNS(svgNS, "rect");
            box.setAttribute("x", bbox[0]);
            box.setAttribute("y", bbox[1]);
            box.setAttribute("width", width);
            box.setAttribute("height", height);
            box.setAttribute("fill", ctrl.is_checked ? "rgba(0, 230, 118, 0.35)" : "rgba(255, 23, 68, 0.15)");
            box.setAttribute("stroke", ctrl.is_checked ? "#00e676" : "#ff1744");
            box.setAttribute("stroke-width", "2");
            box.setAttribute("rx", ctrl.type === 'radio' ? width / 2 : "2");

            box.addEventListener('mouseenter', () => {
              tooltip.style.display = 'block';
              tooltip.innerText = `[${ctrl.type.toUpperCase()}] Checked: ${ctrl.is_checked}\nDark Ratio: ${(ctrl.dark_pixel_ratio * 100 || 0).toFixed(1)}%\nBBox: [${bbox.join(', ')}]`;
            });
            box.addEventListener('mousemove', (e) => {
              tooltip.style.left = (e.clientX + 12) + 'px';
              tooltip.style.top = (e.clientY + 12) + 'px';
            });
            box.addEventListener('mouseleave', () => tooltip.style.display = 'none');

            overlayGroup.appendChild(box);
          });
        }

        // Merged Table Lines
        const lines = page.shapes.filter(s => s.type === 'h_line' || s.type === 'v_line');
        lines.forEach(line => {
          const lineEl = document.createElementNS(svgNS, "line");
          const color = palette[colorIdx % palette.length];
          colorIdx++;

          let x1, y1, x2, y2, details;

          if (line.type === 'h_line') {
            x1 = line.x0;
            x2 = line.x1;
            y1 = line.global_y ?? line.y0;
            y2 = line.global_y ?? line.y0;
            details = `H-Line: Y=${y1}\nX: ${x1} → ${x2} (Len: ${Math.round(x2 - x1)}pt)`;
          } else {
            x1 = line.global_x ?? line.x0;
            x2 = line.global_x ?? line.x0;
            y1 = line.global_y0 ?? line.y0;
            y2 = line.global_y1 ?? line.y1;
            details = `V-Line: X=${x1}\nY: ${y1} → ${y2} (Len: ${Math.round(y2 - y1)}pt)`;
          }

          lineEl.setAttribute("x1", x1);
          lineEl.setAttribute("y1", y1);
          lineEl.setAttribute("x2", x2);
          lineEl.setAttribute("y2", y2);
          lineEl.setAttribute("stroke", color);
          lineEl.setAttribute("stroke-width", config.strokeWidth);
          lineEl.setAttribute("stroke-linecap", "round");
          lineEl.style.cursor = "pointer";

          lineEl.addEventListener('mouseenter', () => {
            lineEl.setAttribute("stroke-width", config.strokeWidth * 2);
            tooltip.style.display = 'block';
            tooltip.innerText = details;
          });
          lineEl.addEventListener('mousemove', (e) => {
            tooltip.style.left = (e.clientX + 12) + 'px';
            tooltip.style.top = (e.clientY + 12) + 'px';
          });
          lineEl.addEventListener('mouseleave', () => {
            lineEl.setAttribute("stroke-width", config.strokeWidth);
            tooltip.style.display = 'none';
          });

          overlayGroup.appendChild(lineEl);
        });
      });

      // --- 6. FLOATING CONTROLS UI ---
      const controlsDiv = document.createElement('div');
      controlsDiv.style.position = 'absolute';
      controlsDiv.style.top = '12px';
      controlsDiv.style.right = '12px';
      controlsDiv.style.display = 'flex';
      controlsDiv.style.gap = '6px';
      controlsDiv.style.zIndex = '10';

      const btnStyle = `
    background: #2a2a32;
    color: #fff;
    border: 1px solid #444;
    border-radius: 4px;
    padding: 6px 10px;
    font-size: 12px;
    font-family: monospace;
    cursor: pointer;
    user-select: none;
  `;

      const resetZoom = () => {
        const containerWidth = target.clientWidth || 800;
        scale = Math.min(containerWidth / maxWidth, 1);
        pointX = (containerWidth - maxWidth * scale) / 2;
        pointY = 20;
        updateTransform();
      };

      const btnZoomIn = document.createElement('button');
      btnZoomIn.innerText = '+';
      btnZoomIn.style.cssText = btnStyle;
      btnZoomIn.onclick = () => { scale = Math.min(scale * 1.2, config.maxScale); updateTransform(); };

      const btnZoomOut = document.createElement('button');
      btnZoomOut.innerText = '-';
      btnZoomOut.style.cssText = btnStyle;
      btnZoomOut.onclick = () => { scale = Math.max(scale / 1.2, config.minScale); updateTransform(); };

      const btnReset = document.createElement('button');
      btnReset.innerText = 'Reset View';
      btnReset.style.cssText = btnStyle;
      btnReset.onclick = resetZoom;

      controlsDiv.appendChild(btnZoomIn);
      controlsDiv.appendChild(btnZoomOut);
      controlsDiv.appendChild(btnReset);

      target.appendChild(controlsDiv);
      target.appendChild(svg);

      // Initial fit
      resetZoom();
    }

    function isolateSection(allBlocks, sectionHeader, nextSectionHeader) {
      let secBlocks = [];
      let inSec = false;
      let endBlock = null;

      allBlocks.forEach((b) => {
        const txt = b.text.trim();
        if (b.text.trim().startsWith(sectionHeader) && !endBlock) {
          inSec = true;
        }
        if (b.text.trim().startsWith(nextSectionHeader)) {
          inSec = false;
          endBlock = b;
        }
        if (inSec) {
          secBlocks.push(b);
        }
      });

      const lines = secBlocks.map(b => b.text);
      const secText = lines.join("\n");

      return [secBlocks, secText, endBlock];
    }

    /**
     * Filters and sorts table lines strictly contained within specified global coordinate ranges.
     * 
     * @param {Array} shapes - The 'shapes' array from parsed pages (or concatenated shapes across pages)
     * @param {Object} options
     * @param {string} options.type - 'horizontal' ('h') or 'vertical' ('v')
     * @param {Array<number>} [options.xRange] - [minX, maxX] global X range constraint
     * @param {Array<number>} [options.yRange] - [minY, maxY] global Y range constraint
     * @param {number} [options.page] - Optional page number filter
     * @param {number} [options.tolerance=0.5] - Coordinate matching tolerance (in pt)
     * @returns {Array<Object>} Sorted list of matching line objects
     */
    function getLinesInRange(shapes, options = {}) {
      const {
        type,
        xRange,
        yRange,
        page,
        tolerance = 1.0
      } = options;

      const isH = type === 'horizontal' || type === 'h' || type === 'h_line';
      const isV = type === 'vertical' || type === 'v' || type === 'v_line';

      if (!isH && !isV) {
        throw new Error("Invalid type parameter. Must be 'horizontal' ('h') or 'vertical' ('v').");
      }

      const targetType = isH ? 'h_line' : 'v_line';

      return shapes.filter(shape => {
        // 1. Filter by shape type
        if (shape.type !== targetType) return false;

        // 2. Optional Page filter
        if (page !== undefined && shape.page !== page) return false;

        // Resolve global coordinates safely across all schema variations
        const lineX0 = isH
          ? (shape.global_x0 ?? shape.x0 ?? shape.global_x ?? shape.x)
          : (shape.global_x ?? shape.x ?? shape.global_x0 ?? shape.x0);

        const lineX1 = isH
          ? (shape.global_x1 ?? shape.x1 ?? shape.global_x ?? shape.x)
          : (shape.global_x ?? shape.x ?? shape.global_x1 ?? shape.x1);

        const lineY0 = isH
          ? (shape.global_y ?? shape.global_y0 ?? shape.y0)
          : (shape.global_y0 ?? shape.y0 ?? shape.global_y ?? shape.y);

        const lineY1 = isH
          ? (shape.global_y ?? shape.global_y1 ?? shape.y1)
          : (shape.global_y1 ?? shape.y1 ?? shape.global_y ?? shape.y);

        // Normalize start/end coordinates
        const startX = Math.min(lineX0, lineX1);
        const endX = Math.max(lineX0, lineX1);
        const startY = Math.min(lineY0, lineY1);
        const endY = Math.max(lineY0, lineY1);

        // Guard against NaN
        if (isNaN(startX) || isNaN(endX) || isNaN(startY) || isNaN(endY)) {
          return false;
        }

        // 3. Filter by X Range [minX, maxX] - Overlap Check for H-Lines, Span Check for V-Lines
        if (xRange && xRange.length === 2) {
          const [minX, maxX] = xRange;
          if (isH) {
            // Horizontal lines must OVERLAP with the requested X window
            const overlapsX = startX <= (maxX + tolerance) && endX >= (minX - tolerance);
            if (!overlapsX) return false;
          } else {
            // Vertical lines must lie WITHIN the X coordinate position
            const insideX = startX >= (minX - tolerance) && endX <= (maxX + tolerance);
            if (!insideX) return false;
          }
        }

        // 4. Filter by Y Range [minY, maxY] - Overlap Check for V-Lines, Span Check for H-Lines
        if (yRange && yRange.length === 2) {
          const [minY, maxY] = yRange;
          if (isV) {
            // Vertical lines must OVERLAP with the requested Y window across pages
            const overlapsY = startY <= (maxY + tolerance) && endY >= (minY - tolerance);
            if (!overlapsY) return false;
          } else {
            // Horizontal lines must lie WITHIN the Y coordinate position
            const insideY = startY >= (minY - tolerance) && endY <= (maxY + tolerance);
            if (!insideY) return false;
          }
        }

        return true;
      }).sort((a, b) => {
        const getGy = (s) => s.global_y ?? s.global_y0 ?? s.y0 ?? 0;
        const getGx = (s) => s.global_x ?? s.global_x0 ?? s.x0 ?? 0;

        if (isH) {
          const diffY = getGy(a) - getGy(b);
          if (Math.abs(diffY) > tolerance) return diffY;
          return getGx(a) - getGx(b);
        } else {
          const diffX = getGx(a) - getGx(b);
          if (Math.abs(diffX) > tolerance) return diffX;
          return getGy(a) - getGy(b);
        }
      });
    }

    /**
     * Converts pre-filtered and pre-sorted table line arrays into structured cell bounding boxes.
     * 
     * @param {Array<Object>} tables - Array of table objects with clean `h_lines` and `v_lines`
     * @returns {Array<Object>} Tables containing rows and individual cell bounding boxes
     */
    function generateCellBoundingBoxes(tables) {
      return tables.map((table, tableIndex) => {
        // 1. Group lines by page to prevent page 6 horizontal lines pairing with page 7 vertical lines
        const pages = [...new Set([
          ...table.h_lines.map(l => l.page),
          ...table.v_lines.map(l => l.page)
        ])].filter(Boolean).sort((a, b) => a - b);

        const allGeneratedRows = [];

        pages.forEach((pageNum) => {
          const pageHLines = table.h_lines
            .filter(l => l.page === pageNum)
            .sort((a, b) => (a.global_y ?? a.y0) - (b.global_y ?? b.y0));

          const rawVLines = table.v_lines.filter(l => l.page === pageNum);

          // 2. Deduplicate vertical lines on this page by X-coordinate to get true column boundaries
          const uniqueXMap = new Map();
          rawVLines.forEach(vl => {
            const xVal = vl.x ?? vl.x0;
            if (!uniqueXMap.has(xVal)) {
              uniqueXMap.set(xVal, vl);
            }
          });

          const pageVLines = Array.from(uniqueXMap.values())
            .sort((a, b) => (a.x ?? a.x0) - (b.x ?? b.x0));

          const numRows = pageHLines.length - 1;
          const numCols = pageVLines.length - 1;

          if (numRows <= 0 || numCols <= 0) return;

          for (let r = 0; r < numRows; r++) {
            const topH = pageHLines[r];
            const bottomH = pageHLines[r + 1];
            const cells = [];

            for (let c = 0; c < numCols; c++) {
              const leftV = pageVLines[c];
              const rightV = pageVLines[c + 1];

              const x0 = leftV.x ?? leftV.x0;
              const x1 = rightV.x ?? rightV.x0;
              const y0 = topH.y ?? topH.y0;
              const y1 = bottomH.y ?? bottomH.y0;

              const globalX0 = leftV.global_x ?? leftV.global_x0 ?? x0;
              const globalX1 = rightV.global_x ?? rightV.global_x0 ?? x1;
              const globalY0 = topH.global_y ?? topH.global_y0 ?? y0;
              const globalY1 = bottomH.global_y ?? bottomH.global_y0 ?? y1;

              cells.push({
                tableIndex,
                rowIndex: allGeneratedRows.length,
                colIndex: c,
                page: pageNum,
                bbox: {
                  x0,
                  x1,
                  y0,
                  y1,
                  width: Number((x1 - x0).toFixed(2)),
                  height: Number((y1 - y0).toFixed(2))
                },
                globalBbox: {
                  x0: globalX0,
                  x1: globalX1,
                  y0: globalY0,
                  y1: globalY1,
                  width: Number((globalX1 - globalX0).toFixed(2)),
                  height: Number((globalY1 - globalY0).toFixed(2))
                }
              });
            }

            allGeneratedRows.push({
              rowIndex: allGeneratedRows.length,
              isHeader: allGeneratedRows.length === 0,
              page: pageNum,
              cells
            });
          }
        });

        return {
          tableIndex,
          rowCount: allGeneratedRows.length,
          colCount: allGeneratedRows[0] ? allGeneratedRows[0].cells.length : 0,
          rows: allGeneratedRows
        };
      });
    }

    /**
     * Maps text blocks into table cell bounding boxes and transforms rows into structured objects.
     * 
     * @param {Object} tableGrid - Single table object output from generateCellBoundingBoxes
     * @param {Array<Object>} textBlocks - Array of text block objects with spatial coordinates
     * @param {Array<string>} columnKeys - Array of key names for each column in order
     * @param {Object} [options]
     * @param {number} [options.tolerance=2.0] - Point tolerance for bounding box containment
     * @returns {Array<Object>} Formatted tableRows array
     */
    function mapTextToTableRows(tableGrid, textBlocks, columnKeys, options = {}) {
      const { tolerance = 2.0 } = options;

      // 1. Group text blocks into cells based on spatial containment
      const cellMap = new Map(); // Key: "rowIndex,colIndex" -> Array of text strings

      for (const block of textBlocks) {
        // Extract block coordinates (prefer global coordinates if available)
        const bX0 = block.global_bbox[0];
        const bX1 = block.global_bbox[2];
        const bY0 = block.global_bbox[1];
        const bY1 = block.global_bbox[3];

        // Center point of the text block for robust placement
        const midX = (bX0 + bX1) / 2;
        const midY = (bY0 + bY1) / 2;

        // Find target cell across all rows
        for (const row of tableGrid.rows) {
          for (const cell of row.cells) {
            const box = cell.globalBbox ?? cell.bbox;

            // Check if block center falls inside cell bounding box (with tolerance)
            const insideX = midX >= (box.x0 - tolerance) && midX <= (box.x1 + tolerance);
            const insideY = midY >= (box.y0 - tolerance) && midY <= (box.y1 + tolerance);

            if (insideX && insideY) {
              const key = `${cell.rowIndex},${cell.colIndex}`;
              if (!cellMap.has(key)) cellMap.set(key, []);
              cellMap.get(key).push({
                text: block.text,
                top: bY0,
                left: bX0
              });
              break;
            }
          }
        }
      }

      // 2. Map cells into output row objects (skipping header row 0)
      const tableRows = [];

      for (const row of tableGrid.rows) {
        if (row.isHeader) continue; // Skip header row

        const rowObject = {};

        row.cells.forEach((cell, cIndex) => {
          const colKey = columnKeys[cIndex];
          if (!colKey) return; // Skip if column exceeds provided keys array

          const cellKey = `${cell.rowIndex},${cell.colIndex}`;
          const blocksInCell = cellMap.get(cellKey) || [];

          // Sort text blocks top-to-bottom, left-to-right within cell
          blocksInCell.sort((a, b) => {
            if (Math.abs(a.top - b.top) > 3) return a.top - b.top;
            return a.left - b.left;
          });

          // Join multi-line cell content with clean whitespace
          rowObject[colKey] = blocksInCell
            .map(b => b.text.trim())
            .filter(Boolean)
            .join(' ');
        });

        tableRows.push(rowObject);
      }

      return tableRows;
    }

    /**
     * Deduplicates overlapping vector controls (e.g., stacked rects/curves),
     * retaining only the largest parent bounding box per region.
     *
     * @param {Array<Object>} shapes - Raw shapes extracted from PDF page
     * @param {Object} [options]
     * @param {number} [options.maxCentroidDistance=12.0] - Max distance to merge overlapping controls
     * @returns {Array<Object>} Deduplicated top-level control objects
     */
    function groupShapesByLargestParent(shapes, options = {}) {
      const { maxCentroidDistance = 12.0 } = options;

      const parseBBox = (raw) => {
        if (!raw) return [0, 0, 0, 0];
        if (Array.isArray(raw)) return raw;
        return [raw.x0, raw.y0, raw.x1, raw.y1];
      };

      // 1. Normalize shapes (keep bounding boxes as clean standard arrays [x0, y0, x1, y1])
      const normalized = shapes.map((shape) => {
        const local = parseBBox(shape.bbox);
        const global = parseBBox(shape.global_bbox);

        const width = shape.width ?? Math.abs(local[2] - local[0]);
        const height = shape.height ?? Math.abs(local[3] - local[1]);

        return {
          type: shape.type ?? 'checkbox',
          page: shape.page,
          width,
          height,
          area: width * height,
          bbox: local,
          global_bbox: global,
          centroid: {
            x: (global[0] + global[2]) / 2,
            y: (global[1] + global[3]) / 2
          },
          is_checked: Boolean(shape.is_checked)
        };
      });

      // 2. Spatial Clustering: Keep ONLY the largest container shape per cluster
      const topLevelControls = [];
      const visited = new Set();

      for (let i = 0; i < normalized.length; i++) {
        if (visited.has(i)) continue;

        let largest = normalized[i];
        visited.add(i);

        for (let j = i + 1; j < normalized.length; j++) {
          if (visited.has(j)) continue;

          const candidate = normalized[j];

          // Check distance between centroids
          const dx = largest.centroid.x - candidate.centroid.x;
          const dy = largest.centroid.y - candidate.centroid.y;
          const dist = Math.hypot(dx, dy);

          if (dist <= maxCentroidDistance) {
            visited.add(j);
            // Replace if candidate represents a larger bounding area
            if (candidate.area > largest.area) {
              largest = candidate;
            }
          }
        }

        // Retain only top-level fields needed for canvas evaluation
        topLevelControls.push({
          type: largest.type,
          page: largest.page,
          bbox: largest.bbox,
          global_bbox: largest.global_bbox,
          is_checked: largest.is_checked
        });
      }

      return topLevelControls;
    }


    /**
     * Logs a clean summary table of evaluated controls to the console.
     * 
     * @param {Array<Object>} controls - Array of evaluated control objects containing type, page, dark_pixel_ratio, is_checked
     * @param {Object} [options]
     * @param {boolean} [options.onlyChecked=false] - If true, logs only checked controls
     * @param {number|null} [options.pageFilter=null] - Optional page number filter
     */
    function logControlsSummary(controls = [], options = {}) {
      const { onlyChecked = false, pageFilter = null } = options;

      if (!Array.isArray(controls) || controls.length === 0) {
        console.warn('⚠️ No controls provided to logControlsSummary().');
        return;
      }

      // Filter controls based on options
      let filtered = controls.filter(c => {
        if (onlyChecked && !c.is_checked) return false;
        if (pageFilter !== null && c.page !== pageFilter) return false;
        return true;
      });

      if (filtered.length === 0) {
        console.log('%c No controls matched the filter criteria.', 'color: #e67e22; font-weight: bold;');
        return;
      }

      // Format dataset for console.table
      const tableData = filtered.map((c, index) => {
        const rawBbox = c.global_bbox ?? c.bbox ?? [];
        const bboxStr = Array.isArray(rawBbox)
          ? `[${rawBbox.map(n => Math.round(n)).join(', ')}]`
          : 'N/A';

        return {
          '#': index + 1,
          'Page': c.page ?? 'N/A',
          'Type': c.type || 'unknown',
          'Status': c.is_checked ? '✅ CHECKED' : '⬜ Unchecked',
          'Dark Pixel %': c.dark_pixel_ratio !== undefined ? `${(c.dark_pixel_ratio * 100).toFixed(1)}%` : 'N/A',
          'Raw Ratio': c.dark_pixel_ratio ?? 'N/A',
          'BBox': bboxStr
        };
      });

      // Calculate summary stats
      const total = controls.length;
      const totalChecked = controls.filter(c => c.is_checked).length;
      const totalUnchecked = total - totalChecked;

      console.group('%c📊 PDF Form Controls Summary', 'color: #3498db; font-size: 14px; font-weight: bold;');
      console.log(`Total Evaluated: %c${total}%c | Checked: %c${totalChecked}%c | Unchecked: %c${totalUnchecked}`,
        'font-weight: bold;', '', 'color: #2ecc71; font-weight: bold;', '', 'color: #e74c3c; font-weight: bold;'
      );

      console.table(tableData);
      console.groupEnd();
    }


    /**
     * Renders thumbnail previews of each control's crop region directly inside the DevTools console
     * using local page bounding boxes (`control.bbox`).
     * 
     * @param {PDFPageProxy} pdfPage - Loaded PDF.js page object
     * @param {Array<Object>} controls - Extracted control objects for this page
     * @param {number} [scale=2.0] - Render scale factor
     */
    async function debugControlPixels(pdfPage, controls, scale = 2.0) {
      const viewport = pdfPage.getViewport({ scale: 1.0 });
      const pageHeight = viewport.height;
      const pageWidth = viewport.width;

      // Render the single PDF page to an offscreen canvas
      const canvas = document.createElement('canvas');
      canvas.width = Math.ceil(pageWidth * scale);
      canvas.height = Math.ceil(pageHeight * scale);
      const ctx = canvas.getContext('2d', { willReadFrequently: true });

      await pdfPage.render({
        canvasContext: ctx,
        viewport: pdfPage.getViewport({ scale })
      }).promise;

      console.group(`🔍 Pixel Inspection: Page ${pdfPage.pageNumber} (${controls.length} controls) [Page Dim: ${pageWidth.toFixed(1)}x${pageHeight.toFixed(1)}pt]`);

      controls.forEach((control, idx) => {
        // 1. Use local bbox directly [x0, y0, x1, y1]
        const rawBbox = control.bbox;
        const [x0, y0, x1, y1] = Array.isArray(rawBbox)
          ? rawBbox
          : [rawBbox.x0, rawBbox.y0, rawBbox.x1, rawBbox.y1];

        // Direct conversion from local PDF points to Canvas pixels
        const pxLeft = Math.floor(x0 * scale);
        const pxTop = Math.floor(y0 * scale);
        const pxWidth = Math.ceil((x1 - x0) * scale);
        const pxHeight = Math.ceil((y1 - y0) * scale);

        // Inner 20% padded evaluation area
        const padX = Math.floor(pxWidth * 0.20);
        const padY = Math.floor(pxHeight * 0.20);
        const cropX = pxLeft + padX;
        const cropY = pxTop + padY;
        const cropW = Math.max(1, pxWidth - padX * 2);
        const cropH = Math.max(1, pxHeight - padY * 2);

        // 2. Create thumbnail crop canvas
        const cropCanvas = document.createElement('canvas');
        cropCanvas.width = Math.max(1, pxWidth);
        cropCanvas.height = Math.max(1, pxHeight);
        const cropCtx = cropCanvas.getContext('2d');

        // Fill white background first (so transparent pixels don't render black)
        cropCtx.fillStyle = '#ffffff';
        cropCtx.fillRect(0, 0, pxWidth, pxHeight);

        // Crop control region from rendered page
        cropCtx.drawImage(
          canvas,
          pxLeft, pxTop, Math.max(1, pxWidth), Math.max(1, pxHeight),
          0, 0, Math.max(1, pxWidth), Math.max(1, pxHeight)
        );

        // Draw inner 20% evaluation border (Green)
        cropCtx.strokeStyle = '#00ff00';
        cropCtx.lineWidth = 1;
        cropCtx.strokeRect(padX, padY, cropW, cropH);

        // 3. Pixel evaluation loop
        let darkPixels = 0;
        const totalPixels = cropW * cropH;

        try {
          const imageData = ctx.getImageData(cropX, cropY, cropW, cropH);
          const data = imageData.data;

          for (let i = 0; i < data.length; i += 4) {
            const r = data[i];
            const g = data[i + 1];
            const b = data[i + 2];
            const alpha = data[i + 3];

            // Skip fully transparent pixels
            if (alpha > 0) {
              const brightness = 0.299 * r + 0.587 * g + 0.114 * b;
              if (brightness < 180) darkPixels++;
            }
          }
        } catch (e) {
          console.warn(`Out of bounds crop for Control #${idx + 1}:`, e);
        }

        const darkRatio = totalPixels > 0 ? (darkPixels / totalPixels) : 0;
        const dataUrl = cropCanvas.toDataURL();
        const displaySize = Math.max(36, pxHeight * 2);

        const css = `
      font-size: 1px;
      padding: ${displaySize / 2}px ${displaySize / 2}px;
      background-image: url(${dataUrl});
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      border: 1px solid #666;
    `;

        console.log(
          `Control #${idx + 1} [${control.type || 'box'}] %c `,
          css,
          `\n  ├─ Local BBox (Pt): [${x0.toFixed(1)}, ${y0.toFixed(1)}, ${x1.toFixed(1)}, ${y1.toFixed(1)}]\n  ├─ Canvas Crop: [pxLeft:${pxLeft}, pxTop:${pxTop}, w:${pxWidth}, h:${pxHeight}]\n  └─ Dark Ratio: ${(darkRatio * 100).toFixed(1)}% | Checked: ${darkRatio > 0.12}`
        );
      });

      console.groupEnd();
    }

    function debugCheckboxes(allBlocks, allShapes) {
      console.group("=== DEBUG: Checkboxes & Radios Inspection ===");

      const relevantShapes = allShapes.filter(s => s.type === 'checkbox' || s.type === 'radio');

      const diagnosticData = relevantShapes.map((shape, index) => {
        let nearestText = "NO TEXT FOUND";
        let minDistance = 9999;

        allBlocks.forEach(block => {
          if (block.page && shape.page && block.page !== shape.page) return;

          const textBbox = block.bbox;
          const verticalDiff = Math.abs(shape.bbox[1] - textBbox[1]);
          const horizontalDistance = textBbox[0] - shape.bbox[2];

          if (verticalDiff <= 15 && horizontalDistance >= -15 && horizontalDistance <= 80) {
            if (Math.abs(horizontalDistance) < minDistance) {
              minDistance = Math.abs(horizontalDistance);
              nearestText = block.text.trim().replace(/\n/g, ' ');
            }
          }
        });

        return {
          index,
          page: shape.page || 1,
          type: shape.type,
          isChecked: shape.is_checked,
          bbox: `[${shape.bbox.map(n => Math.round(n)).join(', ')}]`,
          pairedLabel: nearestText
        };
      });

      console.table(diagnosticData);
      console.groupEnd();
    }

  </script>
